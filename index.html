        link.href = url; link.download = (state.detail.name || "script").replace(/[\\/:*?"<>|]/g, "_").replace(/(?:\.lua)?(?:\.txt)?$/i, "") + ".lua";
        document.body.appendChild(link); link.click(); link.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); return;
      }
      if (action === "code") { if (!state.user) { go("/account"); toast(tr("Сначала войдите в Null’s")); } else await showCode(); return; }
      if (action === "share-script") { await share("/scripts/" + state.detail.uuid); return; }
      if (action === "share-author") { await share("/authors/" + state.author.username); return; }
      if (action === "block-author") { const id = state.author?.uuid; if (!id) return; if (blocks.authors.has(id)) blocks.authors.delete(id); else blocks.authors.add(id); blockStore.save(blocks); authorPage(); return; }
      if (action === "block-script") { const id = state.detail?.uuid; if (!id) return; if (blocks.scripts.has(id)) blocks.scripts.delete(id); else blocks.scripts.add(id); blockStore.save(blocks); detail(); return; }
      if (action === "toggle-d2-random") { if (state.author?.username?.toLowerCase() !== "d2rkmean") return; blocks.hideD2Random = !blocks.hideD2Random; blockStore.save(blocks); authorPage(); return; }
      if (action === "unblock-author" || action === "unblock-script") { const id = control.dataset.id; if (action === "unblock-author") blocks.authors.delete(id); else blocks.scripts.delete(id); blockStore.save(blocks); account(); return; }
      if (action === "copy-room") { await navigator.clipboard.writeText(state.roomLink); toast(tr("Ссылка скопирована")); return; }
      if (action === "favorites") { go("/favorites"); return; }
      if (action === "mine") { go("/mine"); return; }
      if (action === "retry-own") { await loadOwn(); return; }
      if (action === "new") { go("/new"); return; }
      if (action === "edit") { go("/edit/" + state.detail.uuid); return; }
      if (action === "publish") { await publishScript(control); return; }
      if (action === "favorite") {
        if (!state.user) { go("/account"); toast(tr("Сначала войдите в Null’s")); return; }
        const id = state.detail.uuid, remove = state.favorites.has(id);
        await js("/api/users/" + state.user.uuid + "/favorites", { method: remove ? "DELETE" : "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ script_id: id }) });
        if (remove) state.favorites.delete(id); else state.favorites.add(id);
        detail(); toast(tr(remove ? "Удалено из избранного" : "Добавлено в избранное")); return;
      }
      if (action === "logout") { state.indexing = false; try { await js("/api/auth/logout", { method: "POST" }); } catch { /* Clear the local session anyway. */ } localSession = ""; sessionStore.clear(); await clearCodeCache(); state.user = null; state.own = []; state.ownLoaded = false; state.favorites.clear(); state.codes.clear(); editedSincePublish.clear(); publishedWithoutFurtherEdit.clear(); go("/"); toast(tr("Вы вышли")); }
    } catch (error) { toast(error.message); }
  });
  document.addEventListener("submit", async event => {
    if (event.target.id === "login") {
      event.preventDefault();
      const form = event.target, button = form.querySelector("button");
      button.disabled = true;
      try {
        const remember = form.elements.namedItem("remember").checked;
        const result = await js("/api/auth/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ username: form.elements.namedItem("username").value.trim(), password: form.elements.namedItem("password").value, remember }) });
        if (bundled) { if (!result.session) throw new Error(tr("Сервис не вернул сессию.")); localSession = result.session; sessionStore.set(localSession, remember); }
        state.user = result.user; state.own = []; state.ownLoaded = false; await loadFavorites(); go("/mine"); toast(tr("Вход выполнен"));
      } catch (error) { toast(error.message); button.disabled = false; }
    }
    if (event.target.id === "battle-form") { event.preventDefault(); await launch(event.target); }
    if (event.target.id === "script-editor") { event.preventDefault(); await saveEditor(event.target); }
  });
  document.addEventListener("input", event => { if (event.target.id === "search") { state.query = event.target.value; state.visible = 60; const selection = document.activeElement; library(); const fresh = document.getElementById("search"); fresh.focus(); fresh.setSelectionRange(selection.selectionStart || state.query.length, selection.selectionEnd || state.query.length); } if (event.target.name === "content" && event.target.form?.id === "script-editor") document.getElementById("editor-preview").innerHTML = highlight(sourceForUse(event.target.value)); });
  document.addEventListener("change", event => {
    if (event.target.id === "scope") { state.scope = event.target.value; state.visible = 60; library(); }
    if (event.target.id === "sort") { state.sort = event.target.value; state.visible = 60; library(); }
    if (event.target.id === "strip-service-wrapper") { localStorage.setItem("strip-service-wrapper", String(event.target.checked)); }
    if (event.target.id === "language") { localStorage.setItem("language", event.target.value); renderRoute(); }
  });
  document.getElementById("refresh").addEventListener("click", () => loadCatalog(true));
  document.getElementById("help").addEventListener("click", () => go("/help"));
  addEventListener("popstate", renderRoute);
  addEventListener("hashchange", renderRoute);
  state.catalog = catalogStore.get();
  if (state.catalog) document.getElementById("catalog-age").textContent = `${state.catalog.authors.length} ${tr("авторов")} · ${state.catalog.scripts.length} ${tr("скриптов")}`;
  renderRoute();
  loadCatalog();
  restore();
})();
</script>
</body>
</html>
